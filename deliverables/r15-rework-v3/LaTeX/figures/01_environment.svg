<svg xmlns="http://www.w3.org/2000/svg" width="116mm" height="123.733mm" viewBox="0 0 600 640">
<title>01_environment</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#111"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<polyline points="205,54 205,78" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="205,140 205,164" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="205,226 205,251" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="205,315 205,341" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="205,385 205,409" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="205,453 205,477" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="205,539 205,563" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="378,283 420,283" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="32" y="10" width="346" height="44" rx="5" fill="white" stroke="#111" stroke-width="1.8"/>
<text x="205.0" y="37.61" text-anchor="middle" font-family="Times New Roman,Liberation Serif,serif" font-size="17" font-weight="bold" fill="#111">
<tspan x="205.0" dy="0">1000 датчиков → сообщение</tspan>
</text>
<rect x="32" y="78" width="346" height="62" rx="5" fill="white" stroke="#111" stroke-width="1.8"/>
<text x="205.0" y="104.75" text-anchor="middle" font-family="Times New Roman,Liberation Serif,serif" font-size="17" font-weight="normal" fill="#111">
<tspan x="205.0" dy="0">1. Edge: ожидание + обработка</tspan>
<tspan x="205.0" dy="19.72">d_E; отдельный ресурс датчика</tspan>
</text>
<rect x="32" y="164" width="346" height="62" rx="5" fill="white" stroke="#111" stroke-width="1.8"/>
<text x="205.0" y="191.0" text-anchor="middle" font-family="Times New Roman,Liberation Serif,serif" font-size="16" font-weight="normal" fill="#111">
<tspan x="205.0" dy="0">2. Входной канал: ожидание + передача</tspan>
<tspan x="205.0" dy="18.56">d_EF; канал закреплённого Fog</tspan>
</text>
<polygon points="205.0,251 378,283.0 205.0,315 32,283.0" stroke="#111" stroke-width="1.8" fill="white"/>
<text x="205.0" y="279.25" text-anchor="middle" font-family="Times New Roman,Liberation Serif,serif" font-size="15" font-weight="normal" fill="#111">
<tspan x="205.0" dy="0">Fog свободен или есть</tspan>
<tspan x="205.0" dy="17.4">место в буфере B?</tspan>
</text>
<rect x="32" y="341" width="346" height="44" rx="5" fill="white" stroke="#111" stroke-width="1.8"/>
<text x="205.0" y="368.61" text-anchor="middle" font-family="Times New Roman,Liberation Serif,serif" font-size="17" font-weight="normal" fill="#111">
<tspan x="205.0" dy="0">3. Ожидание Fog: w_F</tspan>
</text>
<rect x="32" y="409" width="346" height="44" rx="5" fill="white" stroke="#111" stroke-width="1.8"/>
<text x="205.0" y="436.61" text-anchor="middle" font-family="Times New Roman,Liberation Serif,serif" font-size="17" font-weight="normal" fill="#111">
<tspan x="205.0" dy="0">4. Обслуживание Fog: s_F</tspan>
</text>
<rect x="32" y="477" width="346" height="62" rx="5" fill="white" stroke="#111" stroke-width="1.8"/>
<text x="205.0" y="503.75" text-anchor="middle" font-family="Times New Roman,Liberation Serif,serif" font-size="17" font-weight="normal" fill="#111">
<tspan x="205.0" dy="0">5. Выходной канал:</tspan>
<tspan x="205.0" dy="19.72">ожидание + передача, d_FC</tspan>
</text>
<rect x="32" y="563" width="346" height="62" rx="5" fill="white" stroke="#111" stroke-width="1.8"/>
<text x="205.0" y="589.75" text-anchor="middle" font-family="Times New Roman,Liberation Serif,serif" font-size="17" font-weight="normal" fill="#111">
<tspan x="205.0" dy="0">6. Cloud: ожидание + обработка</tspan>
<tspan x="205.0" dy="19.72">d_C; пул из 40 серверов → результат</tspan>
</text>
<rect x="420" y="254" width="160" height="62" rx="5" fill="white" stroke="#111" stroke-width="1.8"/>
<text x="500.0" y="280.5" text-anchor="middle" font-family="Times New Roman,Liberation Serif,serif" font-size="18" font-weight="bold" fill="#111">
<tspan x="500.0" dy="0">Потеря</tspan>
<tspan x="500.0" dy="20.88">сообщения</tspan>
</text>
<rect x="420" y="80" width="160" height="116" fill="white" stroke="none"/>
<text x="500.0" y="106.16" text-anchor="middle" font-family="Times New Roman,Liberation Serif,serif" font-size="16" font-weight="normal" fill="#111">
<tspan x="500.0" dy="0">Источник отключён:</tspan>
<tspan x="500.0" dy="18.56">новое сообщение</tspan>
<tspan x="500.0" dy="18.56">не создаётся.</tspan>
<tspan x="500.0" dy="18.56">Это не потеря</tspan>
<tspan x="500.0" dy="18.56">в очереди Fog.</tspan>
</text>
<rect x="420" y="360" width="160" height="100" fill="white" stroke="none"/>
<text x="500.0" y="387.44" text-anchor="middle" font-family="Times New Roman,Liberation Serif,serif" font-size="16" font-weight="normal" fill="#111">
<tspan x="500.0" dy="0">B — только места</tspan>
<tspan x="500.0" dy="18.56">ожидания.</tspan>
<tspan x="500.0" dy="18.56">Вместимость Fog:</tspan>
<tspan x="500.0" dy="18.56">K = B + 1.</tspan>
</text>
<rect x="420" y="500" width="160" height="112" fill="white" stroke="none"/>
<text x="500.0" y="524.16" text-anchor="middle" font-family="Times New Roman,Liberation Serif,serif" font-size="16" font-weight="normal" fill="#111">
<tspan x="500.0" dy="0">Прочие очереди</tspan>
<tspan x="500.0" dy="18.56">не ограничены.</tspan>
<tspan x="500.0" dy="18.56">Все ожидания</tspan>
<tspan x="500.0" dy="18.56">включены в D</tspan>
<tspan x="500.0" dy="18.56">ровно один раз.</tspan>
</text>
<text x="233" y="331" text-anchor="middle" font-family="Times New Roman,Liberation Serif,serif" font-size="15" fill="#111" stroke="white" stroke-width="3" paint-order="stroke">да</text>
<text x="400" y="270" text-anchor="middle" font-family="Times New Roman,Liberation Serif,serif" font-size="16" fill="#111" stroke="white" stroke-width="3" paint-order="stroke">нет</text>
</svg>