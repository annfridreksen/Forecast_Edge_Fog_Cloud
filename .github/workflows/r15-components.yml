name: R1.5 independent editorial components
on:
  push:
    branches: [night/fefc-v3]
    paths: ['.github/workflows/r15-components.yml']
permissions:
  contents: write
concurrency:
  group: fefc-r15-components
  cancel-in-progress: false
jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
      SOURCE_DATE_EPOCH: '1795478400'
      FORCE_SOURCE_DATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Confirm sole-writer HEAD and finalize source-based math-count check
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          ref='refs/heads/night/fefc-v3';expected=os.environ['GITHUB_SHA']
          if git('ls-remote','origin',ref).split()[0]!=expected:raise RuntimeError('HEAD changed; do not duplicate writer')
          p=Path('scripts/r15_rework_components.py');s=p.read_text()
          old="require(len(math)>=10,'Word: formulas are native OMML, not images')"
          new="require(len(math)==len(re.findall(r'\\$\\$.*?\\$\\$|\\$[^$\\n]+\\$',text,re.S)),'Word: all source formulas are native OMML, not images')"
          if old in s:s=s.replace(old,new)
          elif new not in s:raise RuntimeError('Unexpected formula-check source')
          s=s.replace("os.environ.get('GITHUB_SHA')","os.environ.get('COMPONENT_SOURCE_SHA',os.environ.get('GITHUB_SHA'))")
          s=s.replace("expected=os.environ['GITHUB_SHA']","expected=os.environ.get('COMPONENT_SOURCE_SHA',os.environ['GITHUB_SHA'])")
          p.write_text(s)
          subprocess.run(['python','-W','error','-m','py_compile',str(p)],check=True)
          if git('diff','--name-only'):
              git('config','user.name','FEFC component executor');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
              git('add','--',str(p))
              if git('diff','--cached','--name-only')!=str(p):raise RuntimeError('Unexpected staged path')
              if git('ls-remote','origin',ref).split()[0]!=expected:raise RuntimeError('HEAD lease lost')
              git('commit','-m','Issue #5 п.5: проверять число OMML по исходным формулам, а не произвольной константе')
              git('push','origin','HEAD:'+ref)
          source=git('rev-parse','HEAD')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('COMPONENT_SOURCE_SHA='+source+'\n')
          print('COMPONENT_SOURCE_SHA',source)
          PY
      - name: Install only document and vector rendering tools
        run: |
          mkdir -p results/r15-components/logs
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          paths=[Path('/etc/apt/sources.list'),*Path('/etc/apt/sources.list.d').glob('*.sources'),*Path('/etc/apt/sources.list.d').glob('*.list'),*Path('/etc/apt').glob('*mirrors*.txt')]
          for p in paths:
              if p.exists():
                  s=p.read_text();n=re.sub(r'https?://[a-z0-9.-]*ec2\.archive\.ubuntu\.com/ubuntu','https://archive.ubuntu.com/ubuntu',s)
                  if n!=s:
                      q=Path('/tmp')/(p.name+'.fefc');q.write_text(n);subprocess.run(['sudo','cp',str(q),str(p)],check=True)
          PY
          timeout -k 15s 150 sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq > results/r15-components/logs/install.log 2>&1 || { tail -40 results/r15-components/logs/install.log; exit 1; }
          timeout -k 15s 480 sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends graphviz pandoc libreoffice-writer fonts-liberation texlive-latex-extra texlive-lang-cyrillic texlive-fonts-recommended cm-super >> results/r15-components/logs/install.log 2>&1 || { tail -40 results/r15-components/logs/install.log; exit 1; }
          timeout 120 python -m pip install --timeout 20 --retries 1 python-docx lxml pymupdf pillow > results/r15-components/logs/python-install.log 2>&1 || { tail -30 results/r15-components/logs/python-install.log; exit 1; }
      - name: Build Word OMML, three vectors, corresponding PDFs and checks
        run: python scripts/r15_rework_components.py build
      - name: Record environment and immutable component hashes
        run: |
          python -m pip freeze > results/r15-components/python-environment.txt
          pandoc --version > results/r15-components/pandoc-version.txt
          libreoffice --version > results/r15-components/libreoffice-version.txt
          dot -V 2> results/r15-components/graphviz-version.txt
          git diff --exit-code -- article submission efc v2 colab configs scripts docs
      - name: Publish only completed independent components under HEAD lease
        run: python scripts/r15_rework_components.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r15-independent-components-${{ github.run_id }}
          path: results/r15-components/
          if-no-files-found: error
