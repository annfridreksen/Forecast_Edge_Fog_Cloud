name: R1.5 finish independent editorial components
on:
  push:
    branches: [night/fefc-v3]
    paths: ['.github/workflows/r15-components.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: fefc-r15-components
  cancel-in-progress: false
jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
      SOURCE_DATE_EPOCH: '1795478400'
      FORCE_SOURCE_DATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Commit addressed style resolution and compatible vector reuse
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,subprocess
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          ref='refs/heads/night/fefc-v3';expected=os.environ['GITHUB_SHA']
          if git('ls-remote','origin',ref).split()[0]!=expected:raise RuntimeError('HEAD lease lost')
          p=Path('scripts/r15_rework_components.py');s=p.read_text()
          helper="\ndef ensure_style(doc,name):\n from docx.enum.style import WD_STYLE_TYPE\n key=name.replace(' ','').casefold()\n for st in doc.styles:\n  if st.style_id.replace(' ','').casefold()==key:\n   st.name=name\n   return st\n return doc.styles.add_style(name,WD_STYLE_TYPE.PARAGRAPH)\n\n"
          if 'def ensure_style(' not in s:s=s.replace('CHECKS=[]\n','CHECKS=[]\n'+helper)
          s=s.replace('st=doc.styles[name]','st=ensure_style(doc,name)')
          old='  shutil.copy2(source,fig/source.name)'
          new="  if (fig/source.name).exists():require(sha(fig/source.name)==sha(source),name+': restored vector source is unchanged')\n  shutil.copy2(source,fig/source.name)"
          if new not in s:s=s.replace(old,new)
          old="run(['dot','-T'+fmt,source,'-o',fig/(name+'.'+fmt)],name=name+'-'+fmt+'.log')"
          new="if not (fig/(name+'.'+fmt)).exists():run(['dot','-T'+fmt,source,'-o',fig/(name+'.'+fmt)],name=name+'-'+fmt+'.log')"
          if new not in s:s=s.replace(old,new)
          for suf,scale in [('-preview.png','1.4'),('-7x.png','7')]:
              old="doc[0].get_pixmap(matrix=fitz.Matrix("+scale+","+scale+"),alpha=False).save(fig/(name+'"+suf+"'))"
              new="if not (fig/(name+'"+suf+"')).exists():"+old
              if new not in s:s=s.replace(old,new)
          p.write_text(s)
          subprocess.run(['python','-W','error','-m','py_compile',str(p)],check=True)
          if git('diff','--name-only'):
              git('config','user.name','FEFC component executor');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
              git('add','--',str(p))
              if git('diff','--cached','--name-only')!=str(p):raise RuntimeError('Unexpected stage')
              if git('ls-remote','origin',ref).split()[0]!=expected:raise RuntimeError('HEAD lease lost before push')
              git('commit','-m','Issue #5 п.5: разрешать стили по ID и не перестраивать сохранённые векторные рисунки')
              git('push','origin','HEAD:'+ref)
          source=git('rev-parse','HEAD')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('COMPONENT_SOURCE_SHA='+source+'\n')
          print('COMPONENT_SOURCE_SHA',source)
          PY
      - name: Restore completed vector stage by measured archive checksum
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.build_r15_submission import download,unpack
          z=Path('results/r15-components-source.zip')
          download('https://api.github.com/repos/annfridreksen/Forecast_Edge_Fog_Cloud/actions/artifacts/14955816074/zip',z,'77c032b53fb046277009c72db85688fdea7ec583f80244ecf977f6a595ee2740',github=True)
          unpack(z,'results/r15-components')
          print('Exact completed vector stage restored; no model computation.')
          PY
      - name: Install document tools with bounded signed package operations
        run: |
          mkdir -p results/r15-components/logs
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          for p in [Path('/etc/apt/sources.list'),*Path('/etc/apt/sources.list.d').glob('*.sources'),*Path('/etc/apt/sources.list.d').glob('*.list'),*Path('/etc/apt').glob('*mirrors*.txt')]:
              if p.exists():
                  s=p.read_text();n=re.sub(r'https?://[a-z0-9.-]*ec2\.archive\.ubuntu\.com/ubuntu','https://archive.ubuntu.com/ubuntu',s)
                  if n!=s:
                      q=Path('/tmp')/(p.name+'.fefc');q.write_text(n);subprocess.run(['sudo','cp',str(q),str(p)],check=True)
          PY
          timeout -k 15s 150 sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq > results/r15-components/logs/resume-install.log 2>&1 || { tail -40 results/r15-components/logs/resume-install.log; exit 1; }
          timeout -k 15s 480 sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends graphviz pandoc libreoffice-writer fonts-liberation texlive-latex-extra texlive-lang-cyrillic texlive-fonts-recommended cm-super >> results/r15-components/logs/resume-install.log 2>&1 || { tail -40 results/r15-components/logs/resume-install.log; exit 1; }
          timeout 120 python -m pip install --timeout 20 --retries 1 python-docx lxml pymupdf pillow > results/r15-components/logs/resume-python-install.log 2>&1 || { tail -30 results/r15-components/logs/resume-python-install.log; exit 1; }
      - name: Complete Word, same-edition PDFs, PSTA fragment and contract checks
        run: python scripts/r15_rework_components.py build
      - name: Record environment and protect unchanged sources
        run: |
          python -m pip freeze > results/r15-components/python-environment.txt
          pandoc --version > results/r15-components/pandoc-version.txt
          libreoffice --version > results/r15-components/libreoffice-version.txt
          dot -V 2> results/r15-components/graphviz-version.txt
          git diff --exit-code -- article submission efc v2 colab configs scripts docs
      - name: Publish only independent components under current HEAD lease
        run: python scripts/r15_rework_components.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r15-independent-components-${{ github.run_id }}
          path: results/r15-components/
          if-no-files-found: error
