name: FEFC R1.4 core regressions
on:
  push:
    branches: [night/fefc-v3]
    paths: ['efc/**', 'tests/**', 'scripts/check_r14_core.py', 'colab/validation/**', 'requirements.txt', '.github/workflows/fefc.yml']
permissions:
  contents: read
concurrency:
  group: fefc-r14-core
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Run scoped model regressions and manual notebook (no training or PDF)
        run: python scripts/check_r14_core.py
      - name: Ensure protected and source files were not rewritten
        if: always()
        run: git diff --exit-code -- v2 docs efc tests scripts colab/validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r14-core-${{ github.sha }}
          path: results/r14/current/
          if-no-files-found: error
