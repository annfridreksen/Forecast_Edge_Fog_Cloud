name: FEFC checked artifacts
on:
  push:
    branches: [night/fefc-v3]
    paths: ['efc/**','tests/**','scripts/**','requirements.txt','.github/workflows/fefc.yml','article/*.tex','article/*.json']
permissions:
  contents: write
concurrency:
  group: fefc-night-v3
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: night/fefc-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Install LaTeX and PDF inspection utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-latex-extra texlive-lang-cyrillic texlive-fonts-recommended cm-super poppler-utils
      - name: Execute clean final check
        run: python scripts/build_artifacts.py
      - name: Publish only generated research artifacts to the same branch
        run: |
          test "$(git branch --show-current)" = night/fefc-v3
          git diff --exit-code -- v2 docs/Журнал_проверок_Perplexity.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add colab article results MANIFEST.sha256 docs/STATUS.md docs/Утверждения.md docs/Отчёт_ночи.md docs/Краткий_план_статьи.md docs/Ответ_на_замечания.md docs/Взаимодействие_с_проверяющим.md docs/Как_пользоваться.md
          git diff --cached --exit-code -- v2 docs/Журнал_проверок_Perplexity.md
          git diff --cached --quiet || git commit -m 'FEFC: Issue #4 — выполненные серии, согласованная статья и ответ на все пункты'
          git push origin HEAD:night/fefc-v3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fefc-checked-output
          include-hidden-files: true
          path: |
            results/
            colab/
            article/
            efc/
            tests/
            scripts/
            docs/
            v2/
            requirements.txt
            MANIFEST.sha256
            .github/workflows/fefc.yml
            !**/__pycache__/**
            !article/*.aux
            !article/*.log
            !article/*.out
            !article/*.brf
