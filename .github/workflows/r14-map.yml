name: R14 bounded scientific map
on:
  push:
    branches: [night/fefc-v3]
    paths: ['configs/r14-night-run.json', '.github/workflows/r14-map.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: fefc-r14-scientific-single-writer
  cancel-in-progress: false
jobs:
  scientific:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Validate checkpoint lineage before any calculation
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          d=json.loads(Path('configs/r14-night-run.json').read_text())
          run=int(os.environ['GITHUB_RUN_ID'])
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/r14-map.yml/runs?branch=night%2Ffefc-v3&per_page=100'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          prior=[x for x in data['workflow_runs'] if x['id']<run]
          latest=max(prior,key=lambda x:x['id']) if prior else None
          if latest:
              assert latest['status']=='completed','Previous scientific run still active'
              assert d['restore_run_id']==latest['id'],'Refuse stale/missing checkpoint lineage'
              assert d['restore_artifact_name']=='r14-map-'+str(latest['id'])
          else:
              assert d['restore_run_id']==0 and d['mode']=='probe'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              print('restore_run_id='+str(d['restore_run_id']),file=f)
              print('restore_artifact_name='+d['restore_artifact_name'],file=f)
          print('Checkpoint lineage accepted; no scientific calculation yet.')
          PY
      - uses: actions/download-artifact@v4
        if: steps.request.outputs.restore_run_id != '0'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.request.outputs.restore_run_id }}
          name: ${{ steps.request.outputs.restore_artifact_name }}
          path: results/r14/restored-map/
      - name: Validate bounded request and storage certificate
        run: |
          python scripts/check_r14_request.py
          python -c "from scripts.migrate_r14_storage import compatible_certificate,ROOT;compatible_certificate(ROOT/'results/r14/compact_storage_compatibility.json')"
      - name: Explicit pilot-only migration or exact current checkpoint
        run: |
          python - <<'PYRESTORE'
          import json,os
          from pathlib import Path
          from efc.grid import read_json,atomic_json,digest,GridRunner
          from efc.primary import PrimarySampler
          from scripts.migrate_r14_storage import migrate,ROOT
          d=read_json('configs/r14-night-run.json')
          src=Path('results/r14/restored-map');dst=Path('results/r14/night-map')
          if d.get('migrate_storage',False):
              assert digest(read_json(src/'manifest.json'))==d['source_manifest_sha256'], 'Wrong source manifest'
              report=migrate(src,dst,ROOT/'results/r14/compact_storage_compatibility.json')
              assert report['imported_primary_requests']==43, 'Unexpected source checkpoint count'
              atomic_json(dst/'restore-provenance.json',dict(source_run_id=d['restore_run_id'],
                  source_artifact_name=d['restore_artifact_name'],source_manifest_sha256=d['source_manifest_sha256'],
                  declared_source_zip_sha256=d['source_zip_sha256'],zip_measured_in_this_job=False,
                  note='ZIP measured in separate local verification; this job verifies primary observations and manifest',
                  migration=report))
          else:
              assert not dst.exists(), 'Do not replace an existing active checkpoint'
              os.replace(src,dst)
              GridRunner(dst,factory=PrimarySampler)._bind()
          print('Exact checkpoint prepared; no scientific seed recalculated.')
          PYRESTORE
      - name: Preserve precise source and dependency versions
        run: |
          mkdir -p results/r14/night-map/source
          git archive --format=tar.gz HEAD -o results/r14/night-map/source/${{ github.sha }}.tar.gz
          python -m pip freeze > results/r14/night-map/source/environment-${{ github.run_id }}.txt
      - name: Bounded request, scientific windows unchanged
        run: |
          set -o pipefail
          mkdir -p results/r14/night-map/logs
          python scripts/run_r14_night.py 2>&1 | tee results/r14/night-map/logs/${{ github.run_id }}.txt
      - name: Tracked sources remain unchanged
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r14-map-${{ github.run_id }}
          path: results/r14/night-map/
          if-no-files-found: warn
          compression-level: 1
