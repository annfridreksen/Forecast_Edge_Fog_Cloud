name: R1.5 continue P and F after saved W
on:
  push:
    branches: [night/fefc-v3]
    paths: ['.github/workflows/r15-full-rework.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: fefc-r15-full-rework
  cancel-in-progress: false
jobs:
  finish_saved:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_DATE_EPOCH: '1795478400'
      FORCE_SOURCE_DATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore exact checkpoint; W already published and must not rerun
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/r15-visual/logs
          timeout -k 15s 120 python -m pip install --timeout 20 --retries 1 lxml pymupdf pyyaml > results/r15-visual/logs/PF-install-python.log 2>&1
          python - <<'PY'
          import os,subprocess,json
          from pathlib import Path
          from scripts import r15_visual_finish as p
          from scripts.build_r15_submission import download,unpack
          if p.git('ls-remote','origin',p.REF).split()[0]!=os.environ['GITHUB_SHA']:raise RuntimeError('HEAD lease lost')
          if p.git('status','--porcelain','--untracked-files=no'):raise RuntimeError('Tracked local changes')
          z=Path('results/saved-WPF-14972494157.zip')
          digest='50170c76179ba2a9b1e8e8044970a84a0d1bf607b09e74b7ad8e839c747ced0e'
          download('https://api.github.com/repos/annfridreksen/Forecast_Edge_Fog_Cloud/actions/artifacts/14972494157/zip',z,digest,github=True)
          unpack(z,p.OUT)
          for name,h in json.loads((p.ROOT/'deliverables/r15-word-readable/SHA256.json').read_text()).items():
              if p.sha(p.ROOT/'deliverables/r15-word-readable'/name)!=h:raise ValueError('Published W changed: '+name)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('VISUAL_HEAD='+os.environ['GITHUB_SHA']+'\n')
          p.put(p.OUT/'PF-resume.json',dict(artifact=14972494157,sha256=digest,W_delivery='de3e2d2c8fc9f907014146c092f15b9ba42e3a33',reviewed_comment=7146911411,reviewed_updated_at='2026-11-24T23:00:57Z',W_repeated=False))
          # Run the exact saved stages, changing only the gate for the now-read comment.
          script="""import subprocess,sys,yaml,hashlib
          from pathlib import Path
          source=subprocess.check_output(['git','show','1540f4c2049ae1e4a2fbc8b3c667d11cd6cc6785:.github/workflows/r15-full-rework.yml'],text=True)
          steps=yaml.safe_load(source)['jobs']['finish_saved']['steps']
          names={'patch':'P - fix class-compatible table references and run scoped source tests','deps':'Install remaining PSTA and comparison dependencies only','p':'P - build changed journal PDF and publish independent checkpoint','diff':'Build pinned comparison tool for F','f':'F - unchanged science, isolated ZIP, diff and coherent packet'}
          stage=sys.argv[1];body=next(x['run'] for x in steps if x.get('name')==names[stage])
          body=body.replace(\"x['id']!=7146889767\",\"x['id'] not in (7146889767,7146911411)\")
          dest=Path('results/r15-visual/logs')/('exact-saved-'+stage+'.sh');dest.write_text(body)
          print('SAVED_STAGE',stage,hashlib.sha256(body.encode()).hexdigest(),flush=True)
          subprocess.run(['bash','-e','-o','pipefail','-c',body],check=True)
          """
          Path('/tmp/fefc_saved_stage.py').write_text(script)
          PY
      - name: P - class-compatible references with scoped tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python /tmp/fefc_saved_stage.py patch
      - name: Install remaining dependencies only
        run: python /tmp/fefc_saved_stage.py deps
      - name: P - affected PDF and separate checkpoint
        run: python /tmp/fefc_saved_stage.py p
      - name: F - build pinned diff tool
        run: python /tmp/fefc_saved_stage.py diff
      - name: F - complete isolated ZIP and coherent packet
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python /tmp/fefc_saved_stage.py f
      - name: Guard unchanged science
        if: always()
        run: |
          git diff --exit-code fc50bb56800a2723aafd0d7e3d5d62b8976300bd HEAD -- efc v2 colab configs article/rework/article_body.md article/rework/metadata.json results/r14/article_evidence.json results/r15/conditional_analysis.json docs/Журнал_проверок_Perplexity.md
          python -m pip freeze > results/r15-visual/PF-environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FEFC-PF-${{ github.run_id }}
          path: results/r15-visual/
          if-no-files-found: error
