name: R1.5 resume saved build - short headers only
on:
  push:
    branches: [night/fefc-v3]
    paths: ['.github/workflows/r15-full-rework.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: fefc-r15-full-rework
  cancel-in-progress: false
jobs:
  saved_article:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_DATE_EPOCH: '1795478400'
      FORCE_SOURCE_DATE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore exact saved build and commit only headers plus STATUS
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/r15_resume_headers.py prepare
      - name: Install only affected LaTeX and inspection dependencies
        run: |
          mkdir -p results/r15-header-resume/install
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          paths=[Path('/etc/apt/sources.list'),*Path('/etc/apt/sources.list.d').glob('*.sources'),*Path('/etc/apt/sources.list.d').glob('*.list'),*Path('/etc/apt').glob('*mirrors*.txt')]
          for p in paths:
              if p.exists():
                  s=p.read_text();n=re.sub(r'https?://[a-z0-9.-]*ec2\.archive\.ubuntu\.com/ubuntu','https://archive.ubuntu.com/ubuntu',s)
                  if n!=s:
                      q=Path('/tmp')/(p.name+'.fefc');q.write_text(n);subprocess.run(['sudo','cp',str(q),str(p)],check=True)
          PY
          timeout -k 15s 120 sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq > results/r15-header-resume/install/apt.log 2>&1 || { tail -40 results/r15-header-resume/install/apt.log; exit 1; }
          timeout -k 15s 360 sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends pandoc texlive-latex-extra texlive-lang-cyrillic texlive-fonts-recommended cm-super >> results/r15-header-resume/install/apt.log 2>&1 || { tail -40 results/r15-header-resume/install/apt.log; exit 1; }
          timeout -k 15s 120 python -m pip install --timeout 20 --retries 1 lxml pymupdf > results/r15-header-resume/install/python.log 2>&1 || { tail -30 results/r15-header-resume/install/python.log; exit 1; }
      - name: Rebuild only PSTA and finish pending checks - keep Word and vectors
        run: python scripts/r15_resume_headers.py finish
      - name: Confirm tracked sources unchanged by document checks
        if: always()
        run: git diff --exit-code -- article submission efc v2 colab configs scripts docs
      - name: Publish actual checked files with HEAD lease
        run: python scripts/r15_resume_headers.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FEFC-R15-v3-headers-${{ github.run_id }}
          path: results/r15-header-resume/
          if-no-files-found: error
