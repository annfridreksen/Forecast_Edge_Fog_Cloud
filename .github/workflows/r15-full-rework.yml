name: R1.5 resume actual rendered Word and finish PSTA targets
on:
  push:
    branches: [night/fefc-v3]
    paths: ['.github/workflows/r15-full-rework.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: fefc-r15-full-rework
  cancel-in-progress: false
jobs:
  finish_saved:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_DATE_EPOCH: '1795478400'
      FORCE_SOURCE_DATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install only remaining PDF and comparison dependencies
        run: |
          mkdir -p results/r15-visual/logs
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          for p in [Path('/etc/apt/sources.list'),*Path('/etc/apt/sources.list.d').glob('*.sources'),*Path('/etc/apt/sources.list.d').glob('*.list'),*Path('/etc/apt').glob('*mirrors*.txt')]:
              if p.exists():
                  s=p.read_text();n=re.sub(r'https?://[a-z0-9.-]*ec2\.archive\.ubuntu\.com/ubuntu','https://archive.ubuntu.com/ubuntu',s)
                  if n!=s:
                      q=Path('/tmp')/(p.name+'.fefc');q.write_text(n);subprocess.run(['sudo','cp',str(q),str(p)],check=True)
          PY
          timeout -k 15s 150 sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq > results/r15-visual/logs/resume-install.log 2>&1 || { tail -40 results/r15-visual/logs/resume-install.log; exit 1; }
          timeout -k 15s 420 sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends texlive-latex-extra texlive-lang-cyrillic texlive-fonts-recommended cm-super poppler-utils make automake g++ libpoppler-glib-dev libwxgtk3.2-dev libcairo2-dev xvfb xauth >> results/r15-visual/logs/resume-install.log 2>&1 || { tail -40 results/r15-visual/logs/resume-install.log; exit 1; }
          timeout -k 15s 120 python -m pip install --timeout 20 --retries 1 lxml pymupdf > results/r15-visual/logs/resume-python.log 2>&1 || { tail -30 results/r15-visual/logs/resume-python.log; exit 1; }
      - name: Restore exact successful Word rendering and save continuation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.r15_visual_resume restore
      - name: Build pinned PDF comparison utility
        run: |
          mkdir -p /tmp/fefc-diff-pdf
          git -C /tmp/fefc-diff-pdf init -q
          git -C /tmp/fefc-diff-pdf remote add origin https://github.com/vslavik/diff-pdf.git
          timeout -k 15s 90 git -C /tmp/fefc-diff-pdf fetch --depth=1 origin 092e6e31968cf28984c201a8c300f76f0020fbe4
          git -C /tmp/fefc-diff-pdf checkout --detach FETCH_HEAD
          cd /tmp/fefc-diff-pdf
          ./bootstrap > "$GITHUB_WORKSPACE/results/r15-visual/logs/diff-build-resume.log" 2>&1
          ./configure >> "$GITHUB_WORKSPACE/results/r15-visual/logs/diff-build-resume.log" 2>&1
          make -j2 >> "$GITHUB_WORKSPACE/results/r15-visual/logs/diff-build-resume.log" 2>&1
          echo 'DIFF_PDF_BIN=/tmp/fefc-diff-pdf/diff-pdf' >> "$GITHUB_ENV"
      - name: Verify actual destinations, isolated ZIP and exact comparison
        run: python -m scripts.r15_visual_resume finish
      - name: Guard scientific sources
        if: always()
        run: |
          git diff --exit-code fc50bb56800a2723aafd0d7e3d5d62b8976300bd HEAD -- efc v2 colab configs article/rework/article_body.md article/rework/metadata.json results/r14/article_evidence.json results/r15/conditional_analysis.json docs/Журнал_проверок_Perplexity.md
          python -m pip freeze > results/r15-visual/resume-python-environment.txt
      - name: Publish completed technical packet with HEAD lease
        run: python -m scripts.r15_visual_resume publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FEFC-R15-visual-complete-${{ github.run_id }}
          path: results/r15-visual/
          if-no-files-found: error
