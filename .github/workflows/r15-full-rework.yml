name: R1.5 resume saved PDF checks and isolated source ZIP
on:
  push:
    branches: [night/fefc-v3]
    paths: ['.github/workflows/r15-full-rework.yml']
permissions:
  contents: write
concurrency:
  group: fefc-r15-full-rework
  cancel-in-progress: false
jobs:
  resume_checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install only dependencies for saved PDF checks and isolated TeX build
        run: |
          python -m pip install --timeout 30 --retries 1 pymupdf lxml
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-lang-cyrillic texlive-fonts-recommended cm-super
      - name: Verify saved bytes, test actual function, unpack and compile source ZIP
        run: python -m scripts.r15_resume_checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FEFC-R15-resume-checks-${{ github.run_id }}
          path: results/r15-resume-checks/
          if-no-files-found: warn
