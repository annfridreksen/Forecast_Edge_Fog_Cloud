name: R1.5 full restored editorial v3
on:
  push:
    branches: [night/fefc-v3]
    paths: ['.github/workflows/r15-full-rework.yml']
permissions:
  contents: write
concurrency:
  group: fefc-r15-full-rework
  cancel-in-progress: false
jobs:
  full_article:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_DATE_EPOCH: '1795478400'
      FORCE_SOURCE_DATE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Confirm exact HEAD and syntax without changing sources
        run: |
          test "$(git ls-remote origin refs/heads/night/fefc-v3 | cut -f1)" = "$GITHUB_SHA"
          python -W error -m py_compile scripts/r15_full_rework.py article/rework/figures/render_figures.py
          python -m json.tool article/rework/metadata.json > /dev/null
      - name: Install signed document dependencies with bounded operations
        run: |
          mkdir -p results/r15-rework-v3/logs
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          paths=[Path('/etc/apt/sources.list'),*Path('/etc/apt/sources.list.d').glob('*.sources'),*Path('/etc/apt/sources.list.d').glob('*.list'),*Path('/etc/apt').glob('*mirrors*.txt')]
          for p in paths:
              if p.exists():
                  s=p.read_text();n=re.sub(r'https?://[a-z0-9.-]*ec2\.archive\.ubuntu\.com/ubuntu','https://archive.ubuntu.com/ubuntu',s)
                  if n!=s:
                      q=Path('/tmp')/(p.name+'.fefc');q.write_text(n);subprocess.run(['sudo','cp',str(q),str(p)],check=True)
          PY
          timeout -k 15s 150 sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq > results/r15-rework-v3/logs/install.log 2>&1 || { tail -40 results/r15-rework-v3/logs/install.log; exit 1; }
          timeout -k 15s 480 sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends pandoc libreoffice-writer fonts-liberation texlive-latex-extra texlive-lang-cyrillic texlive-fonts-recommended cm-super >> results/r15-rework-v3/logs/install.log 2>&1 || { tail -40 results/r15-rework-v3/logs/install.log; exit 1; }
          timeout -k 15s 120 python -m pip install --timeout 20 --retries 1 python-docx lxml pymupdf pillow > results/r15-rework-v3/logs/python-install.log 2>&1 || { tail -30 results/r15-rework-v3/logs/python-install.log; exit 1; }
      - name: Build full Word and PSTA article; verify figures and isolated ZIP
        run: python scripts/r15_full_rework.py build
      - name: Record environment and verify source protection
        if: always()
        run: |
          python -m pip freeze > results/r15-rework-v3/python-environment.txt
          git diff --exit-code -- article submission efc v2 colab configs scripts docs
      - name: Publish complete article and actual checkpoint under HEAD lease
        run: python scripts/r15_full_rework.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FEFC-R15-v3-${{ github.run_id }}
          path: results/r15-rework-v3/
          if-no-files-found: error
