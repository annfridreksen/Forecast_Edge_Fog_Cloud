name: FEFC R1.5 manuscript evidence and submission
on:
  push:
    branches: [night/fefc-v3]
    paths: ['article/**', 'scripts/check_r15_paper.py', 'scripts/build_r15_submission.py', 'scripts/r15_restore_sources.py', 'scripts/r15_publish.py', 'submission/**', '.github/workflows/r14-paper.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: fefc-r14-paper
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore the frozen article snapshot only
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45174257711
          name: r14-map-45174257711
          path: results/r15/frozen131
      - name: Preserve source and dependency versions
        run: |
          mkdir -p results/r15/build
          git archive --format=tar.gz HEAD -o results/r15/build/source.tar.gz
          python -m pip freeze > results/r15/build/dependencies.txt
      - name: Validate R1.5 text, real primary values and accepted notebook outputs
        run: python scripts/check_r15_paper.py --checkpoint results/r15/frozen131 --out results/r15/build/validation
      - name: Source-only stage; no PDF readiness asserted
        run: echo 'B stage only. Compilation, ZIP isolation and submission checks are separate C-stage operations.' > results/r15/build/STAGE.txt
      - name: Protected and scientific sources unchanged
        if: always()
        run: git diff --exit-code -- v2 efc docs tests scripts colab configs article results/r14/article_evidence.json results/r15/service_reference.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r15-text-${{ github.sha }}
          path: results/r15/build/
          if-no-files-found: error
