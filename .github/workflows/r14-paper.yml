name: R1.5 addressed review and reproducible submission
on:
  push:
    branches: [night/fefc-v3]
    paths: ['scripts/r15_postreview.py', '.github/workflows/r14-paper.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: fefc-r14-paper
  cancel-in-progress: false
jobs:
  final_package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Confirm HEAD lease and syntax; do not rerun C9 editing
        run: |
          test "$(git ls-remote origin refs/heads/night/fefc-v3 | cut -f1)" = "$GITHUB_SHA"
          python -W error -m py_compile scripts/r15_postreview.py
      - name: Install standard signed dependencies with bounded operations
        run: |
          mkdir -p results/r15/build
          timeout 300 python -m pip install --timeout 30 --retries 1 -r requirements.txt pymupdf > results/r15/build/install-python.log 2>&1 || { tail -30 results/r15/build/install-python.log; exit 1; }
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          for p in [Path('/etc/apt/sources.list'),*Path('/etc/apt/sources.list.d').glob('*.sources'),*Path('/etc/apt/sources.list.d').glob('*.list')]:
              if p.exists():
                  s=p.read_text();n=re.sub(r'https?://[a-z0-9.-]*ec2\.archive\.ubuntu\.com/ubuntu','https://archive.ubuntu.com/ubuntu',s)
                  if n!=s:
                      t=Path('/tmp')/(p.name+'.fefc');t.write_text(n);subprocess.run(['sudo','cp',str(t),str(p)],check=True)
          PY
          timeout 150 sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq > results/r15/build/install-tex.log 2>&1 || { tail -40 results/r15/build/install-tex.log; exit 1; }
          timeout 600 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends texlive-latex-extra texlive-lang-cyrillic texlive-fonts-recommended cm-super poppler-utils make automake g++ libpoppler-glib-dev libwxgtk3.2-dev libcairo2-dev xvfb xauth >> results/r15/build/install-tex.log 2>&1 || { tail -40 results/r15/build/install-tex.log; exit 1; }
      - name: Apply and commit only reviewed source delta and real BibTeX output
        run: python scripts/r15_postreview.py prepare
      - name: Build pinned diff-pdf utility for changed PDF
        run: |
          mkdir -p /tmp/fefc-diff-pdf
          git -C /tmp/fefc-diff-pdf init -q
          git -C /tmp/fefc-diff-pdf remote add origin https://github.com/vslavik/diff-pdf.git
          timeout 90 git -C /tmp/fefc-diff-pdf fetch --depth=1 origin 092e6e31968cf28984c201a8c300f76f0020fbe4
          git -C /tmp/fefc-diff-pdf checkout --detach FETCH_HEAD
          cd /tmp/fefc-diff-pdf
          ./bootstrap > "$GITHUB_WORKSPACE/results/r15/build/diff-pdf-build.log" 2>&1
          ./configure >> "$GITHUB_WORKSPACE/results/r15/build/diff-pdf-build.log" 2>&1
          make -j2 >> "$GITHUB_WORKSPACE/results/r15/build/diff-pdf-build.log" 2>&1
          test -x /tmp/fefc-diff-pdf/diff-pdf
          echo 'DIFF_PDF_BIN=/tmp/fefc-diff-pdf/diff-pdf' >> "$GITHUB_ENV"
      - name: Restore frozen data and reuse compatible notebook outputs
        run: |
          mkdir -p results/r15/build/work
          python submission/reassemble.py --directory deliverables/r15 --output results/r15/build/work/frozen131.zip
          python - <<'PY'
          import shutil
          from scripts.build_r15_submission import unpack
          unpack('results/r15/build/work/frozen131.zip','results/r15/build/work/frozen131')
          shutil.copytree('deliverables/r15/validation/r14-frozen-output','results/r15/prior-text/validation',dirs_exist_ok=True)
          for n in ('conditional-trace','conditional-tests','author-tests'):
              shutil.copytree('deliverables/r15/validation/'+n,'results/r15/build/'+n,dirs_exist_ok=True)
          print('No scientific simulation, bootstrap or repeated accepted tests.')
          PY
      - name: Record exact execution environment and source
        run: |
          python -m pip freeze > results/r15/build/dependencies.txt
          pdflatex --version > results/r15/build/tex-version.txt
          bibtex --version > results/r15/build/bibtex-version.txt
          printf '%s\n' "$R15_SOURCE_SHA" > results/r15/build/SOURCE_SHA.txt
          git ls-tree -r HEAD -- article scripts submission efc > results/r15/build/source-git-objects.txt
      - name: Build changed PDF isolated source ZIP and diff-PDF
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/r15_build_author.py --out results/r15/build
      - name: Verify rendered Law, both full 7x figures and final ZIP BibTeX regeneration
        run: python scripts/r15_postreview.py inspect
      - name: Retain unchanged evidence outputs and inspect warnings
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,json
          o=Path('results/r15/build')
          shutil.copytree(o/'conditional-trace',o/'delivery/validation/conditional-trace',dirs_exist_ok=True)
          for n in ('dependencies.txt','tex-version.txt','bibtex-version.txt'):
              shutil.copy2(o/n,o/'delivery'/n);shutil.copy2(o/n,o/'work/reproducibility'/n)
          warnings=json.loads((o/'tex-logs/warnings.json').read_text())
          print('TEX_WARNINGS',warnings)
          if any('Overfull' in s for s in warnings):raise ValueError('Overfull in changed PDF; publication blocked')
          diff=json.loads((o/'delivery/difference-provenance.json').read_text())
          assert diff['method']=='diff-pdf' and diff['requested_utility_success']
          print('POSTREVIEW_RECEIPT',(o/'receipt.json').read_text())
          PY
      - name: Ensure build did not alter committed scientific or manuscript sources
        if: always()
        run: git diff --exit-code -- v2 efc docs tests scripts colab configs article submission results/r14/article_evidence.json results/r15/service_reference.json results/r15/conditional_analysis.json
      - name: Publish generated delivery with HEAD lease and verify anonymous bytes
        run: python scripts/r15_publish.py --out results/r15/build
      - name: Persist publication receipt, update STATUS and explicitly release owner
        run: python scripts/r15_postreview.py register
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r15-postreview-${{ github.sha }}
          path: |
            results/r15/build/
            !results/r15/build/work/**
            !results/r15/build/delivery/frozen131.zip.part*
          if-no-files-found: error
