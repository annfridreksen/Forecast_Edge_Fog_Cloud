name: R1.5 final package and difference PDF
on:
  push:
    branches: [night/fefc-v3]
    paths: ['scripts/r15_final_layout.py', '.github/workflows/r14-paper.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: fefc-r14-paper
  cancel-in-progress: false
jobs:
  final_package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Python and TeX dependencies with bounded network calls
        run: |
          mkdir -p results/r15/build
          timeout 300 python -m pip install --timeout 30 --retries 1 -r requirements.txt pymupdf > results/r15/build/install-python.log 2>&1 || { tail -30 results/r15/build/install-python.log; exit 1; }
          timeout 150 sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq > results/r15/build/install-tex.log 2>&1 || { tail -30 results/r15/build/install-tex.log; exit 1; }
          timeout 480 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends texlive-latex-extra texlive-lang-cyrillic texlive-fonts-recommended texlive-plain-generic cm-super latexdiff poppler-utils >> results/r15/build/install-tex.log 2>&1 || { tail -30 results/r15/build/install-tex.log; exit 1; }
      - name: Reassemble already published exact data and reuse unchanged executed cells
        run: |
          mkdir -p results/r15/build/work
          python submission/reassemble.py --directory deliverables/r15 --output results/r15/build/work/frozen131.zip
          python - <<'PY'
          from pathlib import Path
          import shutil
          from scripts.build_r15_submission import unpack
          unpack('results/r15/build/work/frozen131.zip','results/r15/build/work/frozen131')
          shutil.copytree('deliverables/r15/validation/r14-frozen-output','results/r15/prior-text/validation',dirs_exist_ok=True)
          shutil.copytree('deliverables/r15/validation/conditional-trace','results/r15/build/conditional-trace',dirs_exist_ok=True)
          for name in ('conditional-tests','author-tests'):
              shutil.copytree('deliverables/r15/validation/'+name,'results/r15/build/'+name,dirs_exist_ok=True)
          print('No scientific simulations or previously passed tests repeated.')
          PY
      - name: Commit final presentation-only delta with HEAD lease
        run: python scripts/r15_final_layout.py
      - name: Record actual source and versions
        run: |
          git archive --format=tar.gz HEAD -o results/r15/build/source.tar.gz
          python -m pip freeze > results/r15/build/dependencies.txt
          pdflatex --version > results/r15/build/tex-version.txt
          printf '%s\n' "$R15_SOURCE_SHA" > results/r15/build/SOURCE_SHA.txt
      - name: Build changed PDF isolated ZIP and latexdiff
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/r15_build_author.py --out results/r15/build
      - name: Keep actual conditional outputs and versions with delivery
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,json
          o=Path('results/r15/build')
          shutil.copytree(o/'conditional-trace',o/'delivery/validation/conditional-trace',dirs_exist_ok=True)
          for n in ('dependencies.txt','tex-version.txt'):
              shutil.copy2(o/n,o/'delivery'/n);shutil.copy2(o/n,o/'work/reproducibility'/n)
          print('TEX_WARNINGS', (o/'tex-logs/warnings.json').read_text())
          print('DIFF_RESULT',(o/'delivery/difference-provenance.json').read_text())
          PY
      - name: Protect all tracked scientific source
        if: always()
        run: git diff --exit-code -- v2 efc docs tests scripts colab configs article submission results/r14/article_evidence.json results/r15/service_reference.json results/r15/conditional_analysis.json
      - name: Publish generated delivery under lease and verify anonymous downloads
        run: python scripts/r15_publish.py --out results/r15/build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r15-final-${{ github.sha }}
          path: |
            results/r15/build/
            !results/r15/build/work/**
            !results/r15/build/delivery/frozen131.zip.part*
          if-no-files-found: error
