name: FEFC R1.5 isolated submission build and publication
on:
  push:
    branches: [night/fefc-v3]
    paths: ['article/**', 'scripts/check_r15_paper.py', 'scripts/build_r15_submission.py', 'scripts/r15_publish.py', 'submission/**', '.github/workflows/r14-paper.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: fefc-r14-paper
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt pymupdf
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-lang-cyrillic texlive-fonts-recommended cm-super poppler-utils latexdiff
      - name: Reuse the verified B-stage notebook, do not repeat accepted execution
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45276814973
          name: r15-text-5b2a5987d1a148545eae678dba770d66df9a9cb7
          path: results/r15/prior-text
      - name: Preserve exact source and dependency versions
        run: |
          mkdir -p results/r15/build
          git archive --format=tar.gz HEAD -o results/r15/build/source.tar.gz
          python -m pip freeze > results/r15/build/dependencies.txt
          pdflatex --version > results/r15/build/tex-version.txt
      - name: Restore measured primary ZIP; compile, isolate, compare and package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_r15_submission.py --out results/r15/build
      - name: Protect tracked source and scientific files before delivery
        if: always()
        run: git diff --exit-code -- v2 efc docs tests scripts colab configs article submission results/r14/article_evidence.json results/r15/service_reference.json
      - name: Publish this executor's delivery with HEAD lease and verify anonymous downloads
        run: python scripts/r15_publish.py --out results/r15/build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r15-submission-${{ github.sha }}
          path: |
            results/r15/build/
            !results/r15/build/work/**
            !results/r15/build/delivery/frozen131.zip.part*
          if-no-files-found: error
